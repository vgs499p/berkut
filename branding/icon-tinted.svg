<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Berkut: a Su-47 in side profile, nose right, climbing, as one flat
       silhouette on a dusk sky. Colours: #000000 #000000 #000000 sky,
       #FFFFFF silhouette (swapped for the dark and tinted icons). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.6" stop-color="#000000"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g transform="rotate(-10 512 512)" fill="#FFFFFF">
    <!-- fuselage: drooped nose, bubble canopy, spine, stinger, belly, intake -->
    <path d="M944 528
             C 910 518, 870 508, 830 502
             C 812 482, 782 470, 752 470
             C 724 470, 700 480, 676 490
             L 560 494
             L 380 496
             L 220 500
             L 150 506
             L 104 516
             L 150 524
             L 236 530
             L 238 572
             L 300 582
             L 430 594
             L 600 600
             L 640 572
             L 700 562
             C 800 552, 890 540, 944 528 Z"/>
    <!-- pitot boom -->
    <path d="M940 524 L 992 520 L 992 526 L 940 532 Z"/>
    <!-- canard -->
    <path d="M690 500 L 590 474 L 608 512 Z"/>
    <!-- twin canted tails: near fin and the far one just behind it -->
    <path d="M392 496 L 296 336 L 252 334 L 262 498 Z"/>
    <path d="M352 494 L 264 360 L 226 358 L 232 500 Z" opacity="0.75"/>
    <!-- tailplane and forward-swept wing edge-on -->
    <path d="M300 540 L 196 548 L 204 560 L 310 556 Z"/>
    <path d="M560 540 L 400 556 L 404 566 L 566 552 Z"/>
    <!-- engine nozzle -->
    <path d="M240 532 L 214 536 L 214 562 L 240 566 Z"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024">
  <!-- Berkut: a Su-47 seen from above, flying toward the top-right corner,
       red stars on the wingtips. The right half is drawn nose-up once and
       mirrored, then the whole aircraft is turned 45 degrees. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2A3D"/>
      <stop offset="0.6" stop-color="#0F1825"/>
      <stop offset="1" stop-color="#05080D"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2F5F8"/>
      <stop offset="1" stop-color="#C9D2DC"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5E93C4"/>
      <stop offset="1" stop-color="#132A44"/>
    </linearGradient>
    <g id="half">
      <!-- forward-swept wing: broad root, tip well ahead of the root -->
      <path d="M572 560 L822 492 Q850 486 854 512 L860 560 Q862 578 846 586 L580 800 Z" fill="url(#metal)"/>
      <!-- canard -->
      <path d="M566 400 L690 448 Q702 454 696 468 L572 470 Z" fill="url(#metal)"/>
      <!-- tailplane -->
      <path d="M582 792 L688 836 Q700 842 692 856 L584 856 Z" fill="url(#metal)"/>
      <!-- fuselage: nose, cockpit, wide intakes and flat engine body -->
      <path d="M512 120 C 528 180, 540 250, 548 320 L 580 392 L 590 560 L 588 812 L 566 852 L 512 852 Z" fill="url(#metal)"/>
      <!-- leading-edge extension from canard to wing -->
      <path d="M578 466 Q 606 512, 612 552 L 586 566 Z" fill="url(#metal)"/>
      <!-- canted fin, seen edge-on from above -->
      <path d="M586 690 L620 664 L628 812 L592 824 Z" fill="#A9B5C2"/>
      <!-- engine nozzle and the tail stinger -->
      <path d="M534 852 L566 852 L562 880 L538 880 Z" fill="#8995A3"/>
      <path d="M512 852 L526 852 L524 924 L512 934 Z" fill="url(#metal)"/>
      <!-- wing root shading -->
      <path d="M580 600 L650 560 L640 752 L582 790 Z" fill="#B7C2CE" opacity="0.55"/>
      <!-- red star on the wingtip -->
      <path d="M826.0 502.0 L834.2 524.7 L858.3 525.5 L839.3 540.3 L846.0 563.5 L826.0 550.0 L806.0 563.5 L812.7 540.3 L793.7 525.5 L817.8 524.7 Z" fill="#FFFFFF"/>
      <path d="M826.0 510.0 L832.2 527.5 L850.7 528.0 L836.0 539.2 L841.3 557.0 L826.0 546.5 L810.7 557.0 L816.0 539.2 L801.3 528.0 L819.8 527.5 Z" fill="#D7262E"/>
    </g>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g transform="translate(0 -15) rotate(45 512 527)">
    <use xlink:href="#half"/>
    <use xlink:href="#half" transform="translate(1024 0) scale(-1 1)"/>
    <!-- cockpit canopy: frame, tinted glass, glint -->
    <path d="M512 226 C 532 250, 538 296, 530 344 L 512 364 L 494 344 C 486 296, 492 250, 512 226 Z" fill="#8995A3"/>
    <path d="M512 236 C 528 258, 532 300, 526 340 L 512 354 L 498 340 C 492 300, 496 258, 512 236 Z" fill="url(#glass)"/>
    <path d="M508 254 C 503 272, 502 292, 504 312" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>

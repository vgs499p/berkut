name: Guest images

on:
  workflow_dispatch:
  push:
    branches: [multi-distro]
    paths: ["images/**", ".github/workflows/images.yml"]

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: arch, desktop: plasma-mobile }
          - { distro: arch, desktop: phosh }
          - { distro: arch, desktop: plasma }
          - { distro: fedora, desktop: plasma-mobile }
          - { distro: fedora, desktop: phosh }
          - { distro: fedora, desktop: plasma }
          - { distro: ubuntu, desktop: phosh }
          - { distro: ubuntu, desktop: lomiri }
          - { distro: ubuntu, desktop: plasma }
    name: ${{ matrix.distro }}-${{ matrix.desktop }}
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q erofs-utils libarchive-tools zstd gnupg psmisc
      - name: Build
        run: sudo BERKUT_WORK=/var/tmp/berkut images/build.sh ${{ matrix.distro }} ${{ matrix.desktop }} out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.distro }}-${{ matrix.desktop }}
          path: out/
          compression-level: 0
          retention-days: 5

  publish:
    needs: image
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: images/publish.sh out
